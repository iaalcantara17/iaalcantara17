<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="base" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#24324A" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#24324A"/>
      <stop offset="0.85" stop-color="#24324A"/>
      <stop offset="1" stop-color="#24324A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="line">
      <rect x="0" y="5" width="1000" height="2" rx="1"/>
    </clipPath>
  </defs>
  <style>
    .shine { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep {
      0% { transform: translateX(-260px); }
      70% { transform: translateX(1000px); }
      100% { transform: translateX(1000px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .shine { animation: none; transform: translateX(390px); }
    }
  </style>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="url(#base)"/>
  <g clip-path="url(#line)">
    <rect class="shine" x="0" y="5" width="240" height="2" fill="url(#shine)"/>
  </g>
</svg>
