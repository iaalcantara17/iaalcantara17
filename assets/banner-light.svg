<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Israel Alcantara</title>
  <desc id="desc">Banner with the name Israel Alcantara and a subtitle that rotates through: Technical Project Management and IT; Cloud and Software Background; AWS SDE Intern Alum; NJIT CS '26 and Montclair MBA.</desc>
  <defs>
    <radialGradient id="m1" cx="0.18" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#C9D8FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C9D8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m2" cx="0.82" cy="0.95" r="0.65">
      <stop offset="0" stop-color="#BDEBE3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#BDEBE3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m3" cx="0.62" cy="0.05" r="0.45">
      <stop offset="0" stop-color="#FFE1C7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFE1C7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1000" height="260" rx="20"/>
    </clipPath>
  </defs>
  <style>
    .name { font: 700 62px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -1.5px; fill: #14213D; }
    .sub { font: 500 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #3B4A6B; opacity: 0; animation: cycle 16s ease-in-out infinite; }
    .s1 { animation-delay: -0.8s; }
    .s2 { animation-delay: 3.2s; }
    .s3 { animation-delay: 7.2s; }
    .s4 { animation-delay: 11.2s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      5% { opacity: 1; transform: translateY(0); }
      20% { opacity: 1; transform: translateY(0); }
      25% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .rule { fill: #2563EB; }
    .link { stroke: #8FA3C7; stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
    .node { fill: #FFFFFF; stroke: #2563EB; stroke-width: 2; }
    .hub { fill: #2563EB; }
    .packet { fill: #0EA5A4; }
    @media (prefers-reduced-motion: reduce) {
      .sub { animation: none; }
      .s1 { opacity: 1; }
      .packet { display: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="#F6F8FC"/>
    <rect width="1000" height="260" fill="url(#m1)"/>
    <rect width="1000" height="260" fill="url(#m2)"/>
    <rect width="1000" height="260" fill="url(#m3)"/>
    <rect x="0.75" y="0.75" width="998.5" height="258.5" rx="19.5" fill="none" stroke="#14213D" stroke-opacity="0.08" stroke-width="1.5"/>
  </g>
  <rect class="rule" x="64" y="72" width="40" height="4" rx="2"/>
  <text class="name" x="62" y="140">Israel Alcantara</text>
  <g>
    <text class="sub s1" x="64" y="190">Technical Project Management and IT</text>
    <text class="sub s2" x="64" y="190">Cloud and Software Background</text>
    <text class="sub s3" x="64" y="190">AWS SDE Intern Alum</text>
    <text class="sub s4" x="64" y="190">NJIT CS '26 and Montclair MBA</text>
  </g>
  <g aria-hidden="true">
    <path class="link" d="M760 70 L850 110 L800 190 L910 180 L930 90 L850 110"/>
    <path class="link" d="M760 70 L800 190"/>
    <path class="link" d="M930 90 L850 110"/>
    <circle class="node" cx="760" cy="70" r="6"/>
    <circle class="node" cx="800" cy="190" r="6"/>
    <circle class="node" cx="910" cy="180" r="6"/>
    <circle class="node" cx="930" cy="90" r="6"/>
    <circle class="hub" cx="850" cy="110" r="8"/>
    <circle class="packet" r="4">
      <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" path="M760 70 L850 110 L800 190 L910 180 L930 90 L850 110 L760 70"/>
    </circle>
  </g>
</svg>
